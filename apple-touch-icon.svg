<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="300" height="300">
  <defs>
    <!-- Background Gradient (Purple Indigo - Trustworthy & Modern) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    
    <!-- Piggy Body Gradient -->
    <linearGradient id="pigGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB5D5" />
      <stop offset="100%" stop-color="#FF75A0" />
    </linearGradient>

    <!-- Gold Coin Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259" />
      <stop offset="100%" stop-color="#FFA751" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" />
  
  <circle cx="256" cy="220" r="160" fill="#FFFFFF" opacity="0.08" />

  <!-- Gold Coin Slot -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="115" r="40" fill="url(#goldGrad)" />
    <text x="256" y="129" font-family="sans-serif" font-weight="bold" font-size="36" fill="#78350F" text-anchor="middle">฿</text>
  </g>

  <!-- Piggy Character -->
  <g filter="url(#shadow)">
    <!-- Ears -->
    <path d="M 170 185 Q 140 135 195 155 Z" fill="#FF75A0" />
    <path d="M 342 185 Q 372 135 317 155 Z" fill="#FF75A0" />
    
    <!-- Body -->
    <circle cx="256" cy="255" r="115" fill="url(#pigGrad)" />

    <!-- Eyes -->
    <circle cx="210" cy="235" r="12" fill="#1E1B4B" />
    <circle cx="206" cy="231" r="4" fill="#FFFFFF" />
    
    <circle cx="302" cy="235" r="12" fill="#1E1B4B" />
    <circle cx="298" cy="231" r="4" fill="#FFFFFF" />

    <!-- Blush -->
    <ellipse cx="185" cy="257" rx="14" ry="9" fill="#FF3366" opacity="0.35" />
    <ellipse cx="327" cy="257" rx="14" ry="9" fill="#FF3366" opacity="0.35" />

    <!-- Snout -->
    <rect x="226" y="245" width="60" height="42" rx="20" fill="#FF5286" />
    <ellipse cx="243" cy="266" rx="5" ry="8" fill="#991B32" />
    <ellipse cx="269" cy="266" rx="5" ry="8" fill="#991B32" />

    <!-- Smile -->
    <path d="M 240 295 Q 256 307 272 295" stroke="#991B32" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- VS Tag (Comparison Element) -->
  <g filter="url(#shadow)" transform="translate(130, 305) rotate(-12)">
    <rect x="0" y="0" width="56" height="32" rx="8" fill="#FFE259" />
    <circle cx="12" cy="16" r="4" fill="#78350F" />
    <text x="34" y="22" font-family="sans-serif" font-weight="bold" font-size="16" fill="#78350F" text-anchor="middle">VS</text>
  </g>

  <!-- Trust Shield (Reliability Element) -->
  <g filter="url(#shadow)" transform="translate(315, 285)">
    <path d="M 0 15 C 0 15 35 0 35 0 C 35 0 70 15 70 15 C 70 50 55 80 35 95 C 15 80 0 50 0 15 Z" fill="url(#shieldGrad)" />
    <path d="M 22 46 L 31 56 L 49 35" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- App Title Text -->
  <text x="256" y="425" font-family="&#39;Inter&#39;, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">Worth It!</text>
</svg>